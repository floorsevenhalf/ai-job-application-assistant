<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Job Application Assistant — Release Demo</title><style>:root{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:#172033;background:#f4f7fb}body{margin:0}.page{max-width:760px;margin:28px auto;background:white;padding:28px;border-radius:16px;box-shadow:0 12px 35px #1d29391a}h1{margin-top:0}p{color:#59657a}form{display:grid;gap:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label,fieldset{display:grid;gap:6px;border:0;margin:0;padding:0}input,select,textarea{font:inherit;padding:10px;border:1px solid #cfd6e4;border-radius:8px}fieldset .choices{display:flex;gap:18px}.choices label,.consent{display:flex;align-items:center;gap:7px}.actions{display:flex;align-items:center;gap:14px}button{padding:11px 18px;border:0;border-radius:8px;background:#3157d5;color:#fff;font-weight:700}.safety{padding:10px;background:#eef4ff;border-radius:8px;color:#3157d5}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="page"><h1>校园招聘申请演示（完全虚构）</h1><p class="safety">用于演示 Scan → Match → Human Review → Autofill → Undo。扩展不会自动提交。</p><form id="demo-form"><section class="grid" aria-labelledby="basic-title"><h2 id="basic-title" style="grid-column:1/-1">基本信息</h2><label for="demo-name">姓名<input id="demo-name" name="candidate_name" autocomplete="name" placeholder="请输入真实姓名"></label><label for="demo-phone">手机号<input id="demo-phone" name="mobile" type="tel" placeholder="请输入手机号"></label><label for="demo-email">邮箱（已有值保护）<input id="demo-email" name="email" type="email" value="demo@example.com"></label><fieldset><legend>性别</legend><div class="choices"><label><input type="radio" name="gender" value="男">男</label><label><input type="radio" name="gender" value="女">女</label></div></fieldset></section><section class="grid" aria-labelledby="education-title"><h2 id="education-title" style="grid-column:1/-1">教育经历</h2><label for="demo-school">毕业院校<input id="demo-school" name="graduate_school" placeholder="请输入学校"></label><label for="demo-major">所学专业<input id="demo-major" name="major" placeholder="请输入专业"></label><label for="demo-degree">最高学历<select id="demo-degree" name="degree"><option value="">请选择</option><option value="1">本科</option><option value="2">硕士研究生</option><option value="3">博士</option></select></label><label for="demo-college">College（歧义演示）<input id="demo-college" name="college"></label></section><label for="demo-note">个人说明<textarea id="demo-note" name="statement" placeholder="此字段当前不会自动匹配"></textarea></label><label class="consent"><input id="demo-consent" type="checkbox" name="privacy_agreement">我已阅读并同意隐私协议</label><div class="actions"><button id="demo-submit" type="submit">提交申请</button><output id="submit-state">Submit count: 0</output></div></form></main><script>let count=0;document.getElementById("demo-form").addEventListener("submit",event=>{event.preventDefault();count+=1;document.getElementById("submit-state").textContent=`Submit count: ${count}`;});</script></body></html>
